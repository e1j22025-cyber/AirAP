name: build-unsigned-ipa

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Carthage
        run: brew install carthage

      # AirAP は Carthage/Checkouts/Airstream/Airstream.xcodeproj を「サブプロジェクト参照」しているため、
      # ここでは build ではなく checkout だけ行い、後で pbxproj をパッチしてから xcodebuild archive で一緒にビルドします。
      - name: Carthage checkout (sources only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf Carthage
          carthage checkout

      # Airstream 側の deployment target が 18.5 になっていると iOS 15.5 で dyld が落ちます。
      # Carthage/Checkouts 以下の pbxproj を一括で iOS 15.0 に固定します。
      - name: Force iOS 15.0 deployment target in Carthage checkouts
        run: |
          set -e
          echo "Patching IPHONEOS_DEPLOYMENT_TARGET in Carthage/Checkouts..."
          find Carthage/Checkouts -name project.pbxproj -print0 | while IFS= read -r -d '' f; do
            /usr/bin/perl -pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' "$f"
          done
          echo "Patched lines (sample):"
          grep -R "IPHONEOS_DEPLOYMENT_TARGET" -n Carthage/Checkouts | head -n 60 || true

      - name: Clean Xcode caches
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex

      # exit code 65 の原因はログの中の error: に出るので、tee で必ず保存する
      - name: Archive (no codesign)
        run: |
          set -o pipefail
          xcodebuild \
            -project AirAP.xcodeproj \
            -scheme AirAP \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/AirAP.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            SWIFT_PRECOMPILE_BRIDGING_HEADER=NO \
            _EXPERIMENTAL_CLANG_EXPLICIT_MODULES=NO \
            _EXPERIMENTAL_SWIFT_EXPLICIT_MODULES=NO \
            clean archive | tee xcodebuild.log

      # archive 成功時だけ：Airstream が iOS15.5 で起動できるバイナリになっているかチェック
      - name: Inspect embedded Airstream (min OS + symbol)
        if: success()
        run: |
          set -e
          BIN="build/AirAP.xcarchive/Products/Applications/AirAP.app/Frameworks/Airstream.framework/Airstream"
          echo "== vtool (min OS) =="
          xcrun vtool -show-build "$BIN" | tee vtool.txt

          python3 - <<'PY'
import re, sys
text=open("vtool.txt","r",encoding="utf-8").read()
m=re.search(r"minos\\s+([0-9.]+)", text)
if not m:
    print("ERROR: could not parse minos"); sys.exit(1)
minos=m.group(1)

def vt(v): return tuple(int(x) for x in v.split('.'))
if vt(minos) > vt("15.5"):
    print(f"ERROR: Airstream minos is {minos} (> 15.5)"); sys.exit(1)
print(f"OK: Airstream minos {minos}")
PY

          echo "== undefined symbols (must NOT contain objc_claimAutoreleasedReturnValue) =="
          if xcrun nm -u "$BIN" | grep -q "objc_claimAutoreleasedReturnValue"; then
            echo "ERROR: Airstream still references objc_claimAutoreleasedReturnValue (not available on iOS 15.5)"
            xcrun nm -u "$BIN" | grep "objc_claimAutoreleasedReturnValue" || true
            exit 1
          fi

      # 失敗しても必ず error 行を抜粋表示（ログが長くても原因が見える）
      - name: Show first errors
        if: always()
        run: |
          echo "===== FIRST 200 lines containing 'error:' ====="
          grep -n "error:" xcodebuild.log | head -n 200 || true
          echo "===== ARCHIVE FAILED lines ====="
          grep -n "ARCHIVE FAILED" xcodebuild.log || true

      # 失敗しても必ずログを artifacts に残す
      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 3

      # archive が成功したときだけ ipa を作る
      - name: Package ipa
        if: success()
        run: |
          APP="build/AirAP.xcarchive/Products/Applications/AirAP.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -r AirAP-unsigned.ipa Payload

      - name: Upload unsigned ipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AirAP-unsigned-ipa
          path: AirAP-unsigned.ipa
          retention-days: 3
